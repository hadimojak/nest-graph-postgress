version: '3.9'

services:
  postgres:
    image: postgres:latest
    container_name: postgres_local
    restart: always
    environment:
      POSTGRES_USER: mojak
      POSTGRES_PASSWORD: mojak2525
      POSTGRES_DB: hadi
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/my-postgresql/data
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
